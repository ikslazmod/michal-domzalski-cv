name: Deploy career portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Skonfiguruj pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Skonfiguruj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Zainstaluj zależności
        run: pnpm install --frozen-lockfile

      - name: Zbuduj stronę
        run: pnpm --filter @workspace/career-portfolio run build
        env:
          PORT: 4173
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Przygotuj pliki do publikacji
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/career-portfolio/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Opublikuj stronę
        id: deployment
        uses: actions/deploy-pages@v4
